name: Something in Strict Switch doesn't work
description: A bug in the popup, settings, Trackers page or log.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to make it happen
      placeholder: |
        1. Open the popup on example.com
        2. Click ...
  - type: input
    id: version
    attributes:
      label: Strict Switch version
      description: Shown at the top of the settings page.
      placeholder: "0.7.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Edge, Chrome, Brave, Opera, Vivaldi...
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Strict Switch report (optional)
      description: From the activity log. It lists sites you've visited, so check it before posting.
      render: markdown
